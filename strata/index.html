<title>Terrain Gen Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terrain Gen">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#cad9d5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D field under liquid-glass capsules. Portrait: top bar, right camera rail, left brush HUD (sculpt), bottom sheet with detents above a 5-tab dock. Home (creations, library, settings) slides up as its own sheet. Wide screens: sheet docks left. */
:root{
  --sky-a:#eef4f1; --sky-b:#c6d6d2; --ink:#0e1915; --ink-2:rgba(14,25,21,.68); --ink-3:rgba(14,25,21,.46);
  --tint:rgba(240,247,244,.28); --tint-strong:rgba(246,250,248,.82); --edge:rgba(255,255,255,.72); --hair:rgba(14,30,24,.10);
  --track:rgba(14,40,30,.08); --track-2:rgba(14,40,30,.16); --shadow:rgba(10,30,24,.26);
  --accent:#1f5c41; --accent-hi:#3f8f66; --accent-lo:#0f3826; --accent-ink:#f2faf5; --accent-soft:rgba(31,92,65,.14);
  --gold:#b98b25; --gold-hi:#f2d27a; --gold-lo:#7c5a12; --gold-ink:#241703; --gold-soft:rgba(201,160,60,.20);
  --blue:#2b6c9c; --blue-soft:rgba(43,108,156,.14);
  --metal-hi:#fbfcfc; --metal-mid:#cfd5d3; --metal-lo:#a4adaa; --metal-ink:#15201c;
  --node:rgba(255,255,255,.82); --node-head:rgba(255,255,255,.96); --wire:#7f8f89; --good:#1f8f5f; --bad:#b9412e;
  --f-display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-xl:30px; --r-lg:22px; --r-md:16px; --r-sm:11px;
  --la:210deg; --lx:28%;
  --spring:cubic-bezier(.32,1.42,.48,1); --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-a:#132620; --sky-b:#050a08; --ink:#ecf3ef; --ink-2:rgba(236,243,239,.70); --ink-3:rgba(236,243,239,.46);
  --tint:rgba(26,40,34,.36); --tint-strong:rgba(20,32,27,.86); --edge:rgba(255,255,255,.20); --hair:rgba(255,255,255,.10);
  --track:rgba(255,255,255,.07); --track-2:rgba(255,255,255,.15); --shadow:rgba(0,0,0,.55);
  --accent:#3c9a6a; --accent-hi:#77c99a; --accent-lo:#1d5a3e; --accent-ink:#03140b; --accent-soft:rgba(60,154,106,.18);
  --gold:#d9ae4a; --gold-hi:#f6dc8f; --gold-lo:#9a7220; --gold-ink:#1f1402; --gold-soft:rgba(217,174,74,.20);
  --blue:#5aa3d6; --blue-soft:rgba(90,163,214,.16);
  --metal-hi:#6f7a76; --metal-mid:#434c49; --metal-lo:#2a312e; --metal-ink:#eef3f1;
  --node:rgba(24,34,30,.90); --node-head:rgba(36,48,43,.96); --wire:#73837d; --good:#4cc38a; --bad:#ff7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-a:#132620; --sky-b:#050a08; --ink:#ecf3ef; --ink-2:rgba(236,243,239,.70); --ink-3:rgba(236,243,239,.46);
  --tint:rgba(26,40,34,.36); --tint-strong:rgba(20,32,27,.86); --edge:rgba(255,255,255,.20); --hair:rgba(255,255,255,.10);
  --track:rgba(255,255,255,.07); --track-2:rgba(255,255,255,.15); --shadow:rgba(0,0,0,.55);
  --accent:#3c9a6a; --accent-hi:#77c99a; --accent-lo:#1d5a3e; --accent-ink:#03140b; --accent-soft:rgba(60,154,106,.18);
  --gold:#d9ae4a; --gold-hi:#f6dc8f; --gold-lo:#9a7220; --gold-ink:#1f1402; --gold-soft:rgba(217,174,74,.20);
  --blue:#5aa3d6; --blue-soft:rgba(90,163,214,.16);
  --metal-hi:#6f7a76; --metal-mid:#434c49; --metal-lo:#2a312e; --metal-ink:#eef3f1;
  --node:rgba(24,34,30,.90); --node-head:rgba(36,48,43,.96); --wire:#73837d; --good:#4cc38a; --bad:#ff7a66; color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(130% 75% at 72% -8%,var(--sky-a) 0%,var(--sky-b) 80%) fixed,var(--sky-b);color:var(--ink);font-family:var(--f-body);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{flex:none}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 60%),var(--tint);
  -webkit-backdrop-filter:blur(20px) saturate(185%) brightness(1.04);backdrop-filter:blur(20px) saturate(185%) brightness(1.04);
  border-radius:var(--r-xl);box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 18px rgba(255,255,255,.07),0 14px 34px -12px var(--shadow),0 2px 8px -3px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 90% at var(--lx) -20%,rgba(255,255,255,.34),rgba(255,255,255,0) 46%),linear-gradient(0deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:conic-gradient(from var(--la),rgba(255,255,255,.95),rgba(255,255,255,.12) 22%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.08) 74%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glass::before{opacity:.4}:root:not([data-theme="light"]) .glass::after{opacity:.5}}
:root[data-theme="dark"] .glass::before{opacity:.4}:root[data-theme="dark"] .glass::after{opacity:.5}
.press{transition:transform .38s var(--spring),background-color .2s,color .2s,box-shadow .25s}
.press:active{transform:scale(.93)}
.metal{background:linear-gradient(180deg,var(--metal-hi) 0%,var(--metal-mid) 48%,var(--metal-lo) 52%,var(--metal-mid) 100%);color:var(--metal-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.18),0 2px 6px -2px var(--shadow)}
.anodized{background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent) 46%,var(--accent-lo) 54%,var(--accent) 100%);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.25),0 4px 14px -5px var(--accent)}
.goldm{background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 48%,var(--gold-lo) 54%,var(--gold) 100%);color:var(--gold-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.2),0 4px 14px -5px var(--gold)}

/* ---------- top bar, rails ---------- */
#top{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;max-width:720px;margin:0 auto;height:52px;transition:transform .45s var(--ease),opacity .3s}
.brand{display:flex;align-items:center;gap:7px;height:42px;padding:0 12px 0 8px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;min-width:0}
.brand .sub{font-family:var(--f-body);font-weight:600;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.brand .stack{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;min-width:0}
.spacer{flex:1}
.ibtn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.ibtn:disabled{opacity:.28}
.ask{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 11px;border-radius:999px;font-weight:650;font-size:14px}
.ask svg{width:17px;height:17px}
#rail{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:6px;padding:5px;border-radius:999px;transition:transform .45s var(--ease),opacity .3s}
#rail button{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
#rail button svg{width:21px;height:21px}
#rail .sep{height:1px;background:var(--hair);margin:2px 8px}
body.left-hand #rail{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
body.left-hand #hud{left:auto;right:max(12px,env(safe-area-inset-right,0px))}
#hud{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;gap:8px;padding:8px 6px;border-radius:24px;transition:transform .45s var(--ease),opacity .35s}
#hud[hidden]{display:flex!important;opacity:0;transform:translateX(-120%);pointer-events:none}
body.left-hand #hud[hidden]{transform:translateX(120%)}
.vsl{position:relative;width:34px;height:min(30vh,200px);border-radius:17px;background:var(--track);touch-action:none;overflow:hidden}
.vsl i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--accent),var(--accent-hi));border-radius:0 0 17px 17px}
.vsl.gold i{background:linear-gradient(0deg,var(--gold-lo),var(--gold-hi))}
.vsl span{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;pointer-events:none}
.vsl b{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-family:var(--f-mono);font-size:10px;color:var(--accent-ink);pointer-events:none}
#refPin{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 120px);padding:4px;border-radius:18px;width:112px;transition:width .4s var(--spring)}
#refPin img{display:block;width:100%;border-radius:14px}
#refPin.big{width:min(70vw,320px)}
.chip{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
#readout{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
#simChip{position:fixed;z-index:7;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 6px 5px 6px;transition:transform .45s var(--spring),opacity .3s}
#simChip[hidden]{display:flex!important;opacity:0;transform:translate(-50%,-30px);pointer-events:none}
#simChip .txt{display:flex;flex-direction:column;line-height:1.15;font-size:12.5px;font-weight:650;padding-right:4px}
#simChip .txt small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--ink-3)}
#simChip button{height:32px;padding:0 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--track-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s linear,stroke .3s}
.ring.done .fg{stroke:var(--gold)}
.ring .ck{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .5s .1s var(--ease)}
.ring.done .ck{stroke-dashoffset:0}
.ring.spin .fg{animation:ringspin 1.2s linear infinite}
@keyframes ringspin{to{transform:rotate(270deg)}}

/* ---------- bottom sheet + dock ---------- */
#bottom{position:fixed;z-index:6;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto;transition:transform .5s var(--ease)}
body.sculpting #bottom{transform:translateY(calc(var(--sheet-h,40vh) + 8px))}
body.sculpting #top{transform:translateY(-8px);opacity:.65}
#sheet{height:var(--sheet-h,44vh);display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-xl);transition:height .5s var(--spring)}
#sheet.dragging{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab span{width:38px;height:5px;border-radius:5px;background:var(--track-2);transition:width .3s var(--spring)}
.grab:active span{width:54px}
#sheetHead{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 8px 16px;min-height:44px;touch-action:none}
#sheetHead h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
#sheetHead .grow{flex:1;min-width:0}
.sheet-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px 16px 18px;overscroll-behavior:contain}
.enter{animation:enterUp .42s var(--ease) both}
.enter-l{animation:enterL .42s var(--ease) both}.enter-r{animation:enterR .42s var(--ease) both}
@keyframes enterUp{from{opacity:0;transform:translateY(10px)}}
@keyframes enterL{from{opacity:0;transform:translateX(-26px)}}
@keyframes enterR{from{opacity:0;transform:translateX(26px)}}
#dock{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:999px}
#dock .ind{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--tint-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 10px -3px var(--shadow);transition:transform .5s var(--spring),width .5s var(--spring)}
#dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:10.5px;font-weight:650;color:var(--ink-2);min-width:0}
#dock button svg{width:22px;height:22px}
#dock button[aria-selected="true"]{color:var(--accent)}

/* ---------- controls ---------- */
.tip{margin:0 0 12px;font-size:13px;line-height:1.45;color:var(--ink-2);text-wrap:pretty}
.tip b{color:var(--ink);font-weight:650}
.label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px}
.row{display:grid;grid-template-columns:minmax(76px,96px) 1fr 58px;align-items:center;gap:10px;min-height:42px}
.row>label{font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;padding:6px 2px;border-radius:8px}
.row .val:active{background:var(--track)}
.row input.num{width:100%;font-family:var(--f-mono);font-size:13px;text-align:right;border:1px solid var(--gold);border-radius:8px;background:var(--tint-strong);padding:5px 4px}
.sl{position:relative;height:34px;touch-action:pan-y;cursor:ew-resize;outline:none}
.sl .tr{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:6px;background:var(--track-2);overflow:hidden}
.sl .fi{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-lo),var(--accent-hi));border-radius:6px}
.sl .th{position:absolute;top:7px;width:28px;height:20px;margin-left:-14px;border-radius:12px;background:linear-gradient(180deg,#fff,#dde3e0 50%,#c8d0cc 51%,#eef2f0);border:.5px solid rgba(0,0,0,.12);box-shadow:0 3px 10px var(--shadow),inset 0 1px 0 #fff;transition:transform .3s var(--spring),box-shadow .2s}
.sl.on .th{transform:scale(1.18);box-shadow:0 0 0 5px var(--gold-soft),0 4px 14px var(--shadow)}
.sl.anim .fi,.sl.anim .th{transition:left .35s var(--ease),width .35s var(--ease),transform .3s var(--spring)}
.sl .bub{position:absolute;bottom:34px;transform:translateX(-50%) scale(.6);opacity:0;padding:4px 8px;border-radius:9px;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;pointer-events:none;transition:opacity .2s,transform .3s var(--spring)}
.sl.on .bub{opacity:1;transform:translateX(-50%) scale(1)}
.sl.fine .bub::after{content:" · fine";opacity:.7}
.acc{border-top:1px solid var(--hair)}
.acc:first-of-type{border-top:0}
.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;font-weight:650;font-size:14.5px;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .sum{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3);font-family:var(--f-mono)}
.acc>summary .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .35s var(--spring)}
.acc[open]>summary .chev{transform:rotate(90deg)}
.acc[open] .acc-body{animation:enterUp .35s var(--ease)}
.acc .acc-body{padding:0 0 10px}
.dd{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 13px;border-radius:999px;font-size:13.5px;font-weight:650;max-width:100%;min-width:0}
.dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd svg{width:14px;height:14px;opacity:.6}
.dd.wide{display:flex;width:100%;justify-content:space-between;height:42px;border-radius:14px}
#menuLayer{position:fixed;inset:0;z-index:40;pointer-events:none}
#menuLayer.on{pointer-events:auto}
.pop{position:fixed;min-width:200px;max-width:min(330px,calc(100vw - 24px));max-height:min(64vh,520px);overflow-y:auto;padding:6px;border-radius:20px;background:var(--tint-strong);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:0 22px 50px -12px var(--shadow),inset 0 0 0 .5px var(--edge);
  transform-origin:top center;animation:popIn .36s var(--spring)}
.pop.out{animation:popOut .18s var(--ease) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(-6px)}}
@keyframes popOut{to{opacity:0;transform:scale(.94)}}
.pop h4{margin:8px 10px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pop button.it{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;text-align:left;font-size:14.5px}
.pop button.it:active,.pop button.it:hover{background:var(--track)}
.pop button.it small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.pop button.it .ck{margin-left:auto;color:var(--gold);width:16px;height:16px}
.pop button.it .ic{width:20px;height:20px;color:var(--accent)}
.pop .sw{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.seg{position:relative;display:flex;padding:3px;border-radius:14px;background:var(--track);gap:2px}
.seg .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:11px;background:var(--tint-strong);box-shadow:0 2px 8px -2px var(--shadow),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .45s var(--spring),width .45s var(--spring)}
.seg button{position:relative;flex:1;padding:8px 4px;border-radius:11px;font-size:13px;font-weight:650;color:var(--ink-2);white-space:nowrap;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg.big button{padding:10px 4px;font-size:13.5px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border-radius:var(--r-md);background:var(--track);font-size:11.5px;font-weight:650;color:var(--ink-2);min-width:0}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;padding:8px 12px;border-radius:999px;background:var(--track);font-size:13px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--sky-a)}
.swatch{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;min-width:110px;min-height:44px;padding:10px 14px;border-radius:var(--r-md);font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.plain{background:var(--track)}
.btn:disabled{opacity:.45}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:14px}
.toggle small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--track-2);transition:background .3s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#fff,#e8ecea);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.switch input:checked + span{background:linear-gradient(180deg,var(--accent-hi),var(--accent))}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-family:var(--f-mono);font-size:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--track);font-variant-numeric:tabular-nums;margin-top:10px}
.facts span:nth-child(odd){color:var(--ink-3)}
.facts span:nth-child(even){text-align:right}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}
.prompt{display:flex;gap:8px;align-items:flex-end;padding:6px;border-radius:20px;background:var(--track);margin-bottom:8px;transition:box-shadow .3s}
.prompt:focus-within{box-shadow:0 0 0 2px var(--gold-soft)}
.prompt textarea{flex:1;min-width:0;resize:none;border:0;outline:none;background:transparent;padding:8px 8px;font-size:16px;line-height:1.3;height:38px;max-height:110px;-webkit-user-select:text;user-select:text}
.prompt button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.prompt button svg{width:18px;height:18px}
.ai-note{font-size:12.5px;color:var(--ink-2);margin:0 2px 10px;line-height:1.4;white-space:pre-wrap}
.ai-note:empty{display:none}
.seedrow{display:flex;gap:8px;align-items:center}
.seed{flex:1;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:42px;border-radius:14px;background:var(--track);font-family:var(--f-mono);font-size:15px;min-width:0}
.seed input{width:100%;min-width:0;background:transparent;border:0;outline:none;font-family:var(--f-mono);font-size:16px}
.seed span{color:var(--ink-3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-family:var(--f-body);font-weight:700}
.vars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.vars button{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--track);max-width:100%}
.vars canvas{width:100%;height:100%;display:block}
.vars small{position:absolute;left:5px;bottom:4px;font-family:var(--f-mono);font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.padwrap{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:stretch}
.pad{position:relative;aspect-ratio:1.35;border-radius:18px;touch-action:none;overflow:hidden;
  background:linear-gradient(90deg,var(--blue-soft),var(--gold-soft)),linear-gradient(0deg,rgba(255,255,255,0),rgba(255,255,255,.12)),var(--track);box-shadow:inset 0 0 0 1px var(--hair)}
.pad::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:25% 25%}
.pad .knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:linear-gradient(180deg,#fff,#d8dfdc);box-shadow:0 4px 14px var(--shadow),0 0 0 4px var(--accent-soft);transition:box-shadow .25s,transform .35s var(--spring)}
.pad.on .knob{transform:scale(1.15);box-shadow:0 4px 14px var(--shadow),0 0 0 8px var(--gold-soft)}
.pad .ax{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.preview{border-radius:18px;overflow:hidden;background:var(--track);position:relative}
.preview canvas{width:100%;height:100%;display:block;object-fit:cover}
.photo-drop{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--track)}
.photo-drop .thumb{width:84px;height:84px;border-radius:14px;background:var(--track-2) center/cover;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.photo-drop .thumb svg{width:28px;height:28px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--track);font-size:11.5px;font-weight:650;color:var(--ink-2)}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.tag.gold{background:var(--gold-soft);color:var(--gold-lo)}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.simcard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--track);margin:4px 0 8px}
.simcard .play{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative}
.simcard .play .ring{position:absolute;inset:-4px;width:72px;height:72px}
.simcard .play svg.ic{width:24px;height:24px}
.simcard h3{margin:0;font-size:15px;font-family:var(--f-display)}
.simcard p{margin:2px 0 0;font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}

/* ---------- node graph ---------- */
.graph{position:relative;height:clamp(240px,42vh,560px);border-radius:20px;overflow:hidden;touch-action:none;background:
  radial-gradient(circle at 1px 1px,var(--track-2) 1px,transparent 1.5px) 0 0/22px 22px,var(--track)}
.graph-inner{position:absolute;left:0;top:0;transform-origin:0 0}
.graph svg.wires{position:absolute;left:0;top:0;width:4000px;height:4000px;overflow:visible;pointer-events:none}
.graph svg.wires path{fill:none;stroke:var(--wire);stroke-width:2.4}
.node{position:absolute;width:132px;border-radius:16px;background:var(--node);box-shadow:0 8px 22px -10px var(--shadow),inset 0 0 0 .5px var(--edge),inset 0 1px 0 rgba(255,255,255,.4);font-size:12px;animation:popIn .35s var(--spring)}
.node.sel{box-shadow:0 0 0 2px var(--gold),0 10px 26px -8px var(--shadow)}
.node.bye{animation:popOut .2s var(--ease) forwards}
.node .nh{display:flex;align-items:center;gap:6px;padding:7px 9px 6px;border-radius:16px 16px 0 0;background:var(--node-head);font-weight:700;cursor:grab;touch-action:none}
.node .nh i{width:8px;height:8px;border-radius:3px;flex:none}
.node .nh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node canvas{display:block;width:116px;height:72px;margin:6px 8px 8px;border-radius:10px;background:var(--track)}
.port{position:absolute;width:26px;height:26px;display:grid;place-items:center;touch-action:none}
.port::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--node-head);box-shadow:inset 0 0 0 2.5px var(--wire);transition:transform .3s var(--spring)}
.port.in{left:-13px}.port.out{right:-13px}
.port.on::after{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent)}
.port.target::after{transform:scale(1.35);box-shadow:0 0 0 4px var(--gold-soft),inset 0 0 0 2.5px var(--gold)}
.port.src::after{transform:scale(1.35);background:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
.port small{position:absolute;font-size:9.5px;color:var(--ink-3);white-space:nowrap;pointer-events:none}
.gbar{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.gbar .dd{height:34px}
.ginfo{position:absolute;left:10px;bottom:8px;right:10px;font-size:11.5px;color:var(--ink-3);pointer-events:none}

/* ---------- home ---------- */
#home{position:fixed;z-index:20;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  max-width:720px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--tint-strong);transition:transform .55s var(--spring),opacity .3s}
#home[hidden]{display:flex!important;transform:translateY(105%);opacity:0;pointer-events:none}
#home .hh{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 18px}
#home .hh h2{margin:0;flex:1;font-family:var(--f-display);font-size:24px}
#home .hseg{margin:0 14px 8px}
#home .hbody{flex:1;overflow-y:auto;padding:6px 16px 20px;touch-action:pan-y;overscroll-behavior:contain}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--track);text-align:left;transition:transform .4s var(--spring),opacity .3s}
.card img,.card canvas,.card .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--track-2)}
.card .ph{display:grid;place-items:center;color:var(--ink-3)}
.card .ph svg{width:30px;height:30px}
.card .meta{padding:8px 10px 10px}
.card .meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.card.cur{box-shadow:0 0 0 2px var(--gold)}
.card .more{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--tint-strong)}
.card .more svg{width:18px;height:18px}
.card.bye{transform:scale(.7);opacity:0}
.card.new{animation:popIn .45s var(--spring)}
.lib-sec h3{margin:14px 0 8px;font-family:var(--f-display);font-size:17px}
.lib-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;touch-action:pan-x}
.lib-row::-webkit-scrollbar{display:none}
.lib-row .card{flex:0 0 132px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.field{width:100%;height:44px;border-radius:14px;border:1px solid var(--hair);background:var(--track);padding:0 12px;font-size:16px;-webkit-user-select:text;user-select:text}
.meter{height:8px;border-radius:8px;background:var(--track-2);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}

/* ---------- helper ---------- */
#helper{position:fixed;z-index:22;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  right:max(10px,env(safe-area-inset-right,0px));width:min(420px,calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:flex;flex-direction:column;overflow:hidden;background:var(--tint-strong);transition:transform .5s var(--spring),opacity .3s}
#helper[hidden]{display:flex!important;transform:translateX(110%);opacity:0;pointer-events:none}
.h-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 18px}
.h-head h2{margin:0;flex:1;font-family:var(--f-display);font-size:22px}
.h-tabs{margin:0 14px 8px}
.h-body{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px 16px 12px;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere;animation:enterUp .35s var(--ease)}
.msg.me{margin-left:auto;border-bottom-right-radius:6px}
.msg.bot{background:var(--track);border-bottom-left-radius:6px}
.msg.thinking{color:var(--ink-3)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.suggest button{padding:8px 12px;border-radius:999px;background:var(--track);font-size:13px;text-align:left}
.h-input{padding:10px;border-top:1px solid var(--hair)}
.h-input .prompt{margin:0}
.guide{border-top:1px solid var(--hair);padding:12px 0}
.guide:first-child{border-top:0}
.guide h3{margin:0 0 4px;font-size:16px;font-family:var(--f-display);font-weight:700}
.guide p{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.guide ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}

/* quick actions (long-press on terrain) */
#quick{position:fixed;z-index:30;width:0;height:0;pointer-events:none}
#quick button{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:grid;place-items:center;pointer-events:auto;transform:translate(0,0) scale(.3);opacity:0;transition:transform .45s var(--spring),opacity .2s}
#quick.on button{opacity:1}
#quick button svg{width:22px;height:22px}
#quick button small{position:absolute;top:58px;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink);text-shadow:0 1px 2px var(--sky-a)}
#quick .dot{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px var(--gold-soft)}

#toast{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;transition:transform .45s var(--spring),opacity .25s}
#toast[hidden]{display:flex!important;opacity:0;transform:translate(-50%,-24px) scale(.9);pointer-events:none}
#toast svg{width:16px;height:16px;color:var(--gold)}
#busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.14);transition:opacity .25s}
#busy[hidden]{display:grid!important;opacity:0;pointer-events:none}
#busy>div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px;min-width:230px;font-weight:650;transition:transform .4s var(--spring)}
#busy[hidden]>div{transform:scale(.9)}
#busy .bar{width:100%;height:5px;border-radius:5px;background:var(--track-2);overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold-hi));transition:width .25s}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--track-2);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#celebrate{position:fixed;z-index:65;left:50%;top:42%;width:0;height:0;pointer-events:none}
#celebrate i{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0}
#celebrate.go i{animation:conf .9s var(--ease) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}

@media (max-width:420px){.brand .sub{max-width:30vw}.ask b{display:none}.ask{padding:0 12px}.row{grid-template-columns:76px 1fr 52px}}
@media (min-width:900px){
  #bottom{left:max(14px,env(safe-area-inset-left,0px));right:auto;width:420px;margin:0;top:calc(env(safe-area-inset-top,0px) + 70px);flex-direction:column-reverse;justify-content:flex-end}
  #sheet{height:auto!important;flex:1 1 auto;max-height:100%}
  .grab{display:none}
  #sheetHead{padding-top:12px}
  #top{max-width:none}
  #hud{left:450px}
  body.sculpting #bottom{transform:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body.reduce-motion *{transition:none!important;animation:none!important}
/* ---- v1: queue, progress window, guide, first person, clear view, landscape, dial, time strip ---- */
#queueBtn{position:relative}#queueBtn b{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:var(--gold-ink);font-size:10px;line-height:16px;font-weight:800}#queueBtn b:empty{display:none}
#queueBtn.busy svg{animation:sp 2.4s linear infinite}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px}.qrow+.qrow{border-top:1px solid var(--hair)}
.qtx{flex:1;min-width:0}.qtx b{display:block;font-size:13.5px}.qtx small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qt{color:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.qbar{height:5px;border-radius:5px;background:var(--track-2);overflow:hidden;margin-top:6px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold-hi));transition:width .3s}.qbar.big{height:7px;margin:12px 0 4px}
.qspin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--track-2);border-top-color:var(--gold);animation:sp 1s linear infinite;flex:none;margin-top:2px}.qok{color:var(--gold);width:18px;height:18px;flex:none}.qbad{width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
#pw{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.18);transition:opacity .3s}
#pw[hidden]{display:grid!important;opacity:0;pointer-events:none}
.pwc{width:min(360px,100%);padding:16px;border-radius:26px;background:var(--tint-strong);animation:popIn .45s var(--spring)}
.pwc h3{margin:12px 2px 6px;font-family:var(--f-display);font-size:19px}
.pwimg{position:relative;height:150px;border-radius:18px;background:var(--track) center/cover;overflow:hidden;display:grid;place-items:center;color:var(--ink-3)}
.pwimg svg{width:40px;height:40px}
.pwimg.scan::after{content:"";position:absolute;left:0;right:0;height:38%;top:-40%;background:linear-gradient(180deg,transparent,rgba(242,210,122,.55) 80%,rgba(255,255,255,.9));mix-blend-mode:screen;animation:scan 1.6s var(--ease) infinite}
@keyframes scan{to{top:105%}}
.pwsteps{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px;color:var(--ink-3)}
.pwsteps li{display:flex;gap:9px;align-items:center;transition:color .3s}.pwsteps li i{width:16px;height:16px;border-radius:50%;border:2px solid var(--track-2);flex:none;transition:all .35s var(--spring)}

.pwsteps li.ok{color:var(--ink-2)}.pwsteps li.ok i{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--tint-strong)}
#ng{position:fixed;z-index:24;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:760px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--tint-strong);border-radius:var(--r-xl);transition:transform .5s var(--spring),opacity .3s}
#ng[hidden]{display:flex!important;transform:translateY(105%);opacity:0;pointer-events:none}
#ng .hh{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 18px}#ng .hh h2{margin:0;flex:1;font-family:var(--f-display);font-size:24px}

.ngdemo{border-radius:18px;background:var(--track);overflow:hidden;margin-bottom:12px}.ngdemo canvas{display:block;width:100%;height:150px}
.ngcat{margin:16px 0 8px;font-family:var(--f-display);font-size:17px}
.ngcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.ngcard{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px;border-radius:18px;background:var(--track)}
.ngcard canvas{width:84px;height:84px;border-radius:12px;image-rendering:auto;background:var(--track-2)}
.ngcard b{display:flex;align-items:center;gap:6px;font-size:14px}.ngcard b i{width:8px;height:8px;border-radius:3px}
.ngcard p{margin:3px 0;font-size:13px;line-height:1.35}.ngcard small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.35;margin-bottom:6px}.ngcard .dd{height:30px;font-size:12.5px}
#fpUI{position:fixed;inset:0;z-index:8;pointer-events:none}

/* ---- v1.5: settings window, layouts (sheet / floating / minimal), power, fluid micro-interactions ---- */
#settingsWin{position:fixed;z-index:21;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--tint-strong);transition:transform .55s var(--spring),opacity .3s}
#settingsWin[hidden]{display:flex!important;transform:translateY(105%) scale(.98);opacity:0;pointer-events:none}
#settingsWin .hh{display:flex;align-items:center;gap:8px;padding:12px 12px 6px 18px}#settingsWin .hh h2{margin:0;flex:1;font-family:var(--f-display);font-size:22px}
#settingsWin .hbody{flex:1;overflow-y:auto;padding:4px 16px 24px;touch-action:pan-y;overscroll-behavior:contain}
.set-sec{margin:14px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.uipre{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.uipre button{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:16px;background:var(--track);text-align:left;overflow:hidden}
.uipre button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold)}

.uipre .mini{height:44px;border-radius:10px;background:linear-gradient(160deg,#7fa38a,#c9d7cf);position:relative;overflow:hidden}
.uipre .mini i{position:absolute;border-radius:6px;background:var(--pv,rgba(255,255,255,.75))}
.layopt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.layopt button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:16px;background:var(--track);font-size:12px;font-weight:650}
.layopt button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.layopt svg{width:46px;height:34px}
@media (min-width:900px){#settingsWin{left:auto;right:14px;width:440px;max-width:none;top:calc(env(safe-area-inset-top,0px) + 66px);bottom:14px}#settingsWin[hidden]{transform:translateX(110%)}}
/* closed sheet (floating and minimal layouts) */
#bottom.closed #sheet{height:0!important;opacity:0;pointer-events:none;margin-top:-8px}
#sheet{transition:height .5s var(--spring),opacity .25s}
/* floating window */
body.lay-float #bottom{left:max(10px,env(safe-area-inset-left,0px));right:auto;width:min(340px,calc(100vw - 78px));max-width:none;margin:0}

body.lay-float #dock{width:auto;align-self:flex-start;grid-template-columns:repeat(5,48px)}
/* minimal: icon pill dock, compact chrome, panels only when asked */
body.lay-minimal #dock{grid-template-columns:repeat(5,44px);align-self:center;padding:4px}
body.lay-minimal #bottom{max-width:420px}
body.lay-minimal .brand .stack,body.lay-minimal #queueBtn:not(.busy),body.lay-minimal .ask b{display:none}

body.icons-only #dock button svg{width:21px;height:21px}
/* power: battery saver drops blur entirely; while the scene moves, glass gets cheaper so frames stay smooth */
body.pw-battery .glass,body.pw-battery .pop{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--panel)!important}
body.pw-battery .glass::before,body.pw-battery .glass::after{display:none}
body.moving:not(.pw-max) .glass{-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%)}
/* micro-interactions */
.press{position:relative;-webkit-tap-highlight-color:transparent}
.rip{position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:10px;height:10px;margin:-5px;border-radius:50%;background:currentColor;opacity:.18;pointer-events:none;animation:rip .5s var(--ease) forwards}

.sl.on .th{transform:scale(1.18,1.12)}.sl .th{transition:transform .25s var(--spring),box-shadow .25s}
.sl.on .bub{opacity:1;transform:translateY(-4px) scale(1)}.sl .bub{transition:opacity .2s,transform .3s var(--spring)}
.switch input+span::after{transition:transform .38s var(--spring),width .25s}
.switch:active input+span::after{width:28px}
.val.tick{animation:valTick .28s var(--ease)}
@keyframes valTick{30%{transform:translateY(-2px);color:var(--accent)}}
#sheetBody>*{animation:none}
.sheet-scroll.enter>*,.sheet-scroll.enter-l>*,.sheet-scroll.enter-r>*{animation:stag .44s var(--ease) both}
.sheet-scroll.enter>*:nth-child(2),.sheet-scroll.enter-l>*:nth-child(2),.sheet-scroll.enter-r>*:nth-child(2){animation-delay:.03s}
.sheet-scroll.enter>*:nth-child(3),.sheet-scroll.enter-l>*:nth-child(3),.sheet-scroll.enter-r>*:nth-child(3){animation-delay:.06s}
.sheet-scroll.enter>*:nth-child(n+4),.sheet-scroll.enter-l>*:nth-child(n+4),.sheet-scroll.enter-r>*:nth-child(n+4){animation-delay:.09s}

.sl{touch-action:none}
