<title>Strata Terrain Sculptor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed 3D field; liquid-glass capsules float over it — top bar, a bottom tool sheet, and a tab dock. */
:root{
  --sky:#cfdde2; --ink:#17221e; --ink-2:rgba(23,34,30,.64); --ink-3:rgba(23,34,30,.42);
  --glass:rgba(248,251,249,.44); --glass-strong:rgba(250,252,251,.74); --edge:rgba(255,255,255,.75);
  --hair:rgba(23,34,30,.12); --track:rgba(23,34,30,.14); --shadow:rgba(24,36,44,.20);
  --accent:#b8701a; --accent-ink:#fffaf2; --accent-soft:rgba(184,112,26,.16); --danger:#b3402e;
  --f-display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#18211f; --ink:#eef3ef; --ink-2:rgba(238,243,239,.66); --ink-3:rgba(238,243,239,.42);
  --glass:rgba(22,28,27,.50); --glass-strong:rgba(30,37,35,.80); --edge:rgba(255,255,255,.16);
  --hair:rgba(255,255,255,.10); --track:rgba(255,255,255,.16); --shadow:rgba(0,0,0,.45);
  --accent:#f1a640; --accent-ink:#1d1305; --accent-soft:rgba(241,166,64,.18); --danger:#ff8a75; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#18211f; --ink:#eef3ef; --ink-2:rgba(238,243,239,.66); --ink-3:rgba(238,243,239,.42);
  --glass:rgba(22,28,27,.50); --glass-strong:rgba(30,37,35,.80); --edge:rgba(255,255,255,.16);
  --hair:rgba(255,255,255,.10); --track:rgba(255,255,255,.16); --shadow:rgba(0,0,0,.45);
  --accent:#f1a640; --accent-ink:#1d1305; --accent-soft:rgba(241,166,64,.18); --danger:#ff8a75; color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 36px var(--shadow);border-radius:var(--r-lg)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.38),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glass::before{opacity:.35}}
:root[data-theme="dark"] .glass::before{opacity:.35}

/* Top bar */
#top{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;padding:0 6px 0 8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand svg{flex:none}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--accent-soft)}
.icon-btn:disabled{opacity:.3}
.icon-btn svg{width:20px;height:20px}
.mode{display:flex;padding:3px;border-radius:999px;background:var(--track);gap:2px}
.mode button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px var(--shadow)}
.ask-btn{display:flex;align-items:center;gap:6px;padding:0 14px 0 11px;height:40px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
.ask-btn svg{width:17px;height:17px}

/* Readout chip */
#readout{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);
  padding:6px 12px;border-radius:999px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Bottom: sheet + dock */
#bottom{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
#sheet{max-height:min(44vh,430px);overflow:hidden;display:flex;flex-direction:column}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 16px 16px;overscroll-behavior:contain}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sheet-head .sub{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.tip{margin:4px 0 12px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.tip b{color:var(--ink);font-weight:600}
.group{display:flex;flex-direction:column;gap:2px;padding-top:10px;margin-top:6px;border-top:1px solid var(--hair)}
.group:first-of-type{border-top:0;margin-top:0;padding-top:0}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 6px}

#dock{display:grid;grid-template-columns:repeat(6,1fr);padding:5px;border-radius:999px}
#dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--ink-2);min-width:0}
#dock button svg{width:21px;height:21px}
#dock button[aria-selected="true"]{color:var(--accent);background:var(--glass-strong);box-shadow:0 2px 10px var(--shadow)}

/* Controls */
.row{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:10px;min-height:38px}
.row label{font-size:14px;color:var(--ink);min-width:0}
.row output{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--p:50%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:0 3px 10px var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:0 3px 10px var(--shadow)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--track);font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sky)}
.swatch{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--track);gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px var(--shadow)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--r-md);background:var(--track);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{flex:1;min-width:120px;padding:12px 14px;border-radius:var(--r-md);background:var(--track);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:14px}
.toggle small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seedrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.seed{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border-radius:var(--r-md);background:var(--track);font-family:var(--f-mono);font-size:14px;min-width:0}
.seed input{width:100%;min-width:0;background:transparent;border:0;outline:none;font-family:var(--f-mono)}
.seed span{color:var(--ink-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-body);font-weight:600}
.facts{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.6;padding:10px 12px;border-radius:var(--r-sm);background:var(--track);font-variant-numeric:tabular-nums}

/* Helper drawer */
#helper{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  right:max(16px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong)}
.h-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 18px}
.h-head h2{margin:0;flex:1;font-family:var(--f-display);font-size:21px}
.h-tabs{margin:0 14px 8px}
.h-body{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px 16px 12px;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.bot{background:var(--track);border-bottom-left-radius:6px}
.msg.note{background:transparent;color:var(--ink-3);font-size:12.5px;padding:2px 4px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.suggest button{padding:8px 12px;border-radius:999px;background:var(--track);font-size:13px;text-align:left}
.h-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--hair)}
.h-input textarea{flex:1;resize:none;height:44px;max-height:120px;padding:11px 14px;border-radius:22px;border:1px solid var(--hair);background:var(--glass);outline:none;font-size:15px;-webkit-user-select:text;user-select:text}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.guide{border-top:1px solid var(--hair);padding:12px 0}
.guide:first-child{border-top:0}
.guide h3{margin:0 0 4px;font-size:15.5px;font-family:var(--f-display);font-weight:700}
.guide p{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.guide ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}
.guide li{margin:2px 0}
.guide .btn{margin-top:8px;flex:none;width:100%}

#toast{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#busy{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(0,0,0,.08)}
#busy div{padding:14px 20px;font-weight:600}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}

@media (min-width:900px){
  #bottom{left:max(16px,env(safe-area-inset-left,0px));right:auto;width:400px;margin:0;top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);flex-direction:column-reverse;justify-content:flex-end}
  #sheet{max-height:none;flex:0 1 auto}
  #top{max-width:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:430px){.brand span{display:none}.mode button{padding:7px 10px}.ask-btn{padding:0 12px 0 10px}#top{gap:4px}}
#sheet.collapsed{display:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin-top:10px}
.facts span:nth-child(odd){color:var(--ink-3)}
.facts span:nth-child(even){text-align:right;color:var(--ink)}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}
.seed button{color:var(--accent);font-weight:600;font-size:13px;padding:6px 2px;white-space:nowrap}
.msg.bot b{font-weight:600}
.msg.bot.thinking{color:var(--ink-3)}
</style>

<canvas id="view" aria-label="3D terrain view"></canvas>

<header id="top" class="glass">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19 9 7l4 6 3-4 6 10z" fill="var(--accent)"/><path d="M2 19h20" stroke="var(--ink)" stroke-width="1.6"/><path d="M5 22h14" stroke="var(--ink-3)" stroke-width="1.6"/></svg>
    <span>Strata</span>
  </div>
  <div class="mode" role="group" aria-label="Touch mode">
    <button id="modeOrbit" aria-pressed="true">Orbit</button>
    <button id="modeSculpt" aria-pressed="false">Sculpt</button>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="icon-btn" id="redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="ask-btn" id="openHelper" aria-label="Open helper"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>Ask</button>
</header>

<div id="readout" class="glass" hidden></div>

<div id="bottom">
  <section id="sheet" class="glass" aria-live="polite"><div class="sheet-scroll" id="sheetBody"></div></section>
  <nav id="dock" class="glass" role="tablist" aria-label="Tools"></nav>
</div>

<aside id="helper" class="glass" hidden aria-label="Helper">
  <div class="h-head">
    <h2>Field guide</h2>
    <button class="icon-btn" id="closeHelper" aria-label="Close helper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="seg h-tabs" role="group">
    <button id="hTabAsk" aria-pressed="true">Ask</button>
    <button id="hTabGuides" aria-pressed="false">Guides</button>
  </div>
  <div class="h-body" id="hAsk"></div>
  <div class="h-body" id="hGuides" hidden></div>
  <form class="h-input" id="askForm">
    <textarea id="askInput" rows="1" placeholder="Ask how to make something…" aria-label="Message"></textarea>
    <button class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</aside>

<div id="toast" class="glass" hidden></div>
<div id="busy" hidden><div class="glass" id="busyText">Working…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="fail"><p>The 3D engine could not load. Check your connection and reopen the page.</p></div>');throw new Error('three missing')}

/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const fmt=n=>Math.round(n).toLocaleString('en-US');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(seed){
  const rnd=mulberry32(seed>>>0),p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=p[i];p[i]=p[j];p[j]=t}
  const perm=new Uint8Array(512);for(let i=0;i<512;i++)perm[i]=p[i&255];
  const GX=[1,-1,1,-1,1,-1,0,0],GY=[1,1,-1,-1,0,0,1,-1];
  const F2=.5*(Math.sqrt(3)-1),G2=(3-Math.sqrt(3))/6;
  return function(x,y){
    const s=(x+y)*F2,i=Math.floor(x+s),j=Math.floor(y+s),t=(i+j)*G2;
    const x0=x-(i-t),y0=y-(j-t);const i1=x0>y0?1:0,j1=1-i1;
    const x1=x0-i1+G2,y1=y0-j1+G2,x2=x0-1+2*G2,y2=y0-1+2*G2;const ii=i&255,jj=j&255;
    let n=0,q;
    let t0=.5-x0*x0-y0*y0;if(t0>0){q=perm[ii+perm[jj]]&7;t0*=t0;n+=t0*t0*(GX[q]*x0+GY[q]*y0)}
    let t1=.5-x1*x1-y1*y1;if(t1>0){q=perm[ii+i1+perm[jj+j1]]&7;t1*=t1;n+=t1*t1*(GX[q]*x1+GY[q]*y1)}
    let t2=.5-x2*x2-y2*y2;if(t2>0){q=perm[ii+1+perm[jj+1]]&7;t2*=t2;n+=t2*t2*(GX[q]*x2+GY[q]*y2)}
    return 70*n;
  }
}
function fbm(n,x,y,oct,gain){let s=0,a=1,f=1,norm=0;for(let o=0;o<oct;o++){s+=a*n(x*f+o*17.3,y*f-o*9.1);norm+=a;a*=gain;f*=2.02}return s/norm}

async function hydraulic(drops,power,onProg){

  const chunk=4000;
  for(let d0=0;d0<drops;d0+=chunk){
    for(let dd=0;dd<chunk&&d0+dd<drops;dd++){
      let x=1+rnd()*(N-3),y=1+rnd()*(N-3),dx=0,dy=0,speed=1,wat=1,sed=0;
      for(let l=0;l<life;l++){
        const i=x|0,j=y|0,fx=x-i,fy=y-j,k=j*N+i;
        const h00=h[k],h10=h[k+1],h01=h[k+N],h11=h[k+N+1];
        const gx=(h10-h00)*(1-fy)+(h11-h01)*fy,gy=(h01-h00)*(1-fx)+(h11-h10)*fx,hh=lerp(lerp(h00,h10,fx),lerp(h01,h11,fx),fy);

      }
    }
    onProg(Math.min(1,(d0+chunk)/drops));await nextFrame();
  }
  for(let k=0;k<h.length;k++)H[k]=Math.max(0,h[k]*maxH);
}
async function thermal(talusDeg,passes,onProg){
  const cell=S.shape.world/(N-1),tal=Math.tan(talusDeg*Math.PI/180)*cell,nb=[-1,1,-N,N];

    for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){
      const k=j*N+i;let maxD=0,lo=-1;for(const o of nb){const d=H[k]-H[k+o];if(d>maxD){maxD=d;lo=k+o}}

function makeOBJ(t,base,yb,name){

    const per=perimeter(t.Mm),P=per.length,W=S.shape.world;let vb=nv,vtb=nv,vnb=nv;
    L.push('o Base');
    const topIdx=per.map(([i,j])=>j*t.Mm+i+1);
    for(const [i,j] of per){const k=j*t.Mm+i;L.push(`v ${f3(t.pos[k*3])} ${f3(yb)} ${f3(t.pos[k*3+2])}`)}

    let total=0,acc=0,top=yb;const lens=[];for(let q=0;q<P;q++){const a=topIdx[q]-1,b=topIdx[(q+1)%P]-1,l=Math.hypot(t.pos[b*3]-t.pos[a*3],t.pos[b*3+2]-t.pos[a*3+2]);lens.push(l);total+=l;top=Math.max(top,t.pos[a*3+1])}

    for(const [i,j] of per){const k=j*t.Mm+i;L.push(`vt ${f5(t.pos[k*3]/W+.5)} ${f5(.5-t.pos[k*3+2]/W)}`)}L.push('vt 0.5 0.5');

  if(dl){
    try{await dl.save({filename:name,data:blob});toast('Saved '+name)}

    <div class="group"><div class="label">Weathering (thermal)</div>${sl('ero.talus','Talus angle',15,60,1,deg)}${sl('ero.passes','Passes',5,80,1,v=>`${v}`)}<div class="btns"><button class="btn" id="runTh">Run weathering</button></div></div>
    <div class="group"><div class="label">Whole map</div><div class="btns"><button class="btn" id="runSm">Smooth all</button><button class="btn" id="runSh">Sharpen all</button></div></div>`;

function bindSheet(){
  const b=$('#sheetBody');
  b.querySelectorAll('input[type=range]').forEach(r=>{
    const k=r.dataset.k,o=b.querySelector(`#o_${k.replace('.','_')}`),sp=()=>r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%');sp();
    r.oninput=()=>{set(k,+r.value);o.textContent=FMT[k](+r.value);sp();onParam(k)};
    r.onchange=()=>{regenArmed=true};
  });
  b.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{set(c.dataset.k,c.checked);onParam(c.dataset.k);if(c.dataset.k==='exp.base')renderSheet()});
  b.querySelectorAll('[data-seg]').forEach(x=>x.onclick=()=>{
    const k=x.dataset.seg,raw=x.dataset.v,v=isNaN(+raw)?raw:+raw;
    if(k==='S.res'){busy(true,'Resampling…');setTimeout(()=>{setRes(v);busy(false);renderSheet()},30);return}
    set(k,v);if(k==='biome.palette')recolorSoon();if(k==='exp.fmt')renderSheet();else{b.querySelectorAll(`[data-seg="${k}"]`).forEach(y=>y.setAttribute('aria-pressed',y===x));renderExportFacts()}saveSoon();
  });
  b.querySelectorAll('[data-preset]').forEach(x=>x.onclick=()=>{applyPreset(x.dataset.preset);toast(x.dataset.preset+' loaded')});
  b.querySelectorAll('[data-tool]').forEach(x=>x.onclick=()=>setTool(x.dataset.tool));
  b.querySelectorAll('[data-paint]').forEach(x=>x.onclick=()=>{S.paint=x.dataset.paint;setTool('paint')});
  const on=(id,f)=>{const el=b.querySelector('#'+id);if(el)el.onclick=f};
  const si=b.querySelector('#seedIn');if(si)si.onchange=()=>{const v=parseInt(si.value,10);if(!isNaN(v)){S.seed=Math.abs(v)%1e9;regenerate();toast('Seed '+S.seed)}};
  on('dice',()=>{S.seed=(Math.random()*1e6)|0;si.value=S.seed;regenerate();renderFacts()});
  on('runHyd',()=>runErosion('hydraulic'));on('runTh',()=>runErosion('thermal'));on('runSm',()=>runErosion('smooth'));on('runSh',()=>runErosion('sharpen'));
  on('clrPaint',()=>{pushUndo();clearPaint();updateAll();saveSoon();toast('Paint cleared')});
  on('frameBtn',frame);on('expBtn',exportNow);
  on('resetBtn',()=>{b.querySelector('#resetConfirm').hidden=false});on('resetNo',()=>{b.querySelector('#resetConfirm').hidden=true});
  on('resetYes',()=>{pushUndo();const keep=S.tab;S=DEF();S.tab=keep;prevMaxH=S.shape.maxH;if(N!==S.res){N=S.res;buildGeometry()}regenerate(false);frame();renderSheet();toast('Fresh start')});
}
function renderFacts(){const f=$('#facts');if(!f)return;const W=S.shape.world;f.innerHTML=`<span>Area</span><span>${(W*W/1e6).toFixed(2)} km²</span><span>Lowest point</span><span>${fmt(stats.lo)} m</span><span>Highest point</span><span>${fmt(stats.hi)} m</span><span>Relief</span><span>${fmt(stats.hi-stats.lo)} m</span><span>Under water</span><span>${Math.round(stats.water*100)}%</span><span>Grid</span><span>${N} × ${N} · ${(W/(N-1)).toFixed(1)} m/cell</span>`}
function renderExportFacts(){
  const f=$('#expFacts');if(!f)return;const e=S.exp;
  if(e.fmt==='height'){f.innerHTML=`<span>Heightmap</span><span>${N} × ${N}, 16-bit</span><span>Range</span><span>${fmt(stats.lo)}–${fmt(stats.hi)} m</span><span>Color map</span><span>${e.tex} px</span>`;return}
  const Mm=(N-1)/e.detail+1,v=Mm*Mm,tr=(Mm-1)*(Mm-1)*2,base=e.base?(Mm-1)*4:0;
  f.innerHTML=`<span>Vertices</span><span>${fmt(v+(e.base?base+1:0))}</span><span>Triangles</span><span>${fmt(tr+(e.base?base*3:0))}</span><span>UV layout</span><span>1 island, 0 seams</span><span>Texture</span><span>${e.tex} × ${e.tex} albedo</span><span>Size</span><span>${fmt(S.shape.world)} m · Y up</span>`;
}

function stateSummary(){return{preset:S.preset,seed:S.seed,grid:N,shape:S.shape,biome:S.biome,brush:{tool:S.tool,...S.brush,paint:S.paint},view:S.view,stats:{lowest_m:Math.round(stats.lo),highest_m:Math.round(stats.hi),underwater_pct:Math.round(stats.water*100)}}}
const num=(v,a,b)=>v==null||isNaN(+v)?undefined:clamp(+v,a,b);
const HELPER_TOOLS=[
  {name:'get_terrain',description:'Returns the current terrain settings and stats (heights in meters).',execute:()=>stateSummary()},
  {name:'apply_preset',description:'Loads a preset landscape, replacing the current one. Names: '+Object.keys(PRESETS).join(', ')+'.',inputSchema:{type:'object',properties:{name:{type:'string',enum:Object.keys(PRESETS)}},required:['name']},execute:i=>{if(!applyPreset(String(i.name)))throw new Error('Unknown preset');return'Loaded '+i.name}},
  {name:'set_shape',description:'Changes landform settings and regenerates the map (replaces sculpting). freq 0.8-6 (feature scale), oct 3-8, gain 0.3-0.65 roughness, ridges 0-1, warp 0-1, peaks 0.6-3 (higher = sharper isolated peaks), cone 0-1 (one big central mountain), crater 0-1 (bowl at its summit), island 0-1, terrace 0-1, tsteps 3-14, maxH 20-900 m, world 400-8000 m, seed integer.',
    inputSchema:{type:'object',properties:{freq:{type:'number'},oct:{type:'number'},gain:{type:'number'},ridges:{type:'number'},warp:{type:'number'},peaks:{type:'number'},island:{type:'number'},terrace:{type:'number'},tsteps:{type:'number'},maxH:{type:'number'},world:{type:'number'},seed:{type:'number'}}},
    execute:i=>{pushUndo();const R={cone:[0,1],crater:[0,1],freq:[.8,6],oct:[3,8],gain:[.3,.65],ridges:[0,1],warp:[0,1],peaks:[.6,3],island:[0,1],terrace:[0,1],tsteps:[3,14],maxH:[20,900],world:[400,8000]};
      for(const k in R){const v=num(i[k],...R[k]);if(v!==undefined)S.shape[k]=k==='oct'||k==='tsteps'?Math.round(v):v}if(i.seed!=null&&!isNaN(+i.seed))S.seed=Math.abs(+i.seed|0);prevMaxH=S.shape.maxH;S.preset='Custom';regenerate(false);frame();renderSheet();return stateSummary()}},
  {name:'set_biome',description:'Recolors without changing heights. palette temperate|arid|tundra|volcanic; sea 0-0.6 and snow 0.2-1 are fractions of max height (snow 1 = none); beach 0-0.05; rock 0.2-1.4 (lower = rock on gentler slopes); lush 0-1 vegetation.',

    execute:i=>{if(PALETTES[i.palette])S.biome.palette=i.palette;const R={sea:[0,.6],snow:[.2,1],beach:[0,.05],rock:[.2,1.4],lush:[0,1]};for(const k in R){const v=num(i[k],...R[k]);if(v!==undefined)S.biome[k]=v}updateAll();renderSheet();saveSoon();return S.biome}},
  {name:'erode',description:'Runs erosion over the whole map. kind: hydraulic (rain carves gullies), thermal (slopes slump), smooth, sharpen. amount: light|medium|heavy.',
    inputSchema:{type:'object',properties:{kind:{type:'string',enum:['hydraulic','thermal','smooth','sharpen']},amount:{type:'string',enum:['light','medium','heavy']}},required:['kind']},
    execute:async i=>{const a={light:0,medium:1,heavy:2}[i.amount]??1;await runErosion(String(i.kind),i.kind==='hydraulic'?[25000,60000,140000][a]:i.kind==='thermal'?[15,35,70][a]:0);return'Done. '+JSON.stringify(stateSummary().stats)}},
  {name:'set_view',description:'Changes the view: sunEl 4-85 degrees, sunAz 0-360, vex 0.5-3 vertical exaggeration, water and base booleans.',inputSchema:{type:'object',properties:{sunEl:{type:'number'},sunAz:{type:'number'},vex:{type:'number'},water:{type:'boolean'},base:{type:'boolean'}}},
    execute:i=>{const R={sunEl:[4,85],sunAz:[0,360],vex:[.5,3]};for(const k in R){const v=num(i[k],...R[k]);if(v!==undefined)S.view[k]=v}if(typeof i.water==='boolean')S.view.water=i.water;if(typeof i.base==='boolean')S.view.base=i.base;updateAll();renderSheet();return S.view}},

const MANUAL=`You are the helper inside Strata, a mobile terrain generator and sculptor. Tabs: Shape (presets ${Object.keys(PRESETS).join(', ')}; seed; Scale, Detail, Roughness, Ridges, Warp, Peaks, Central peak, Crater, Island, Terraces, Steps; Max height; World size; changing landform regenerates and replaces sculpting), Sculpt (Orbit/Sculpt mode in top bar; tools Raise, Lower, Smooth, Flatten (to height where stroke starts), Roughen, Paint; Size, Strength, Softness, Mirror; on phones one finger sculpts and two fingers move the camera), Erode (Rainfall = hydraulic with Raindrops and Carving; Weathering = thermal with Talus angle and Passes; Smooth all, Sharpen all), Paint (palette, Sea level, Beach, Snow line, Rock slope, Vegetation; paint materials ${Object.values(PAINTS).map(p=>p.n).join(', ')}), Scene (sun height/direction, exaggeration, water, diorama base, shadows, wireframe, grid 129/257/513), Export (GLB, OBJ, Heightmap as a .zip; mesh detail; 1024/2048 texture; solid base; terrain UVs are one seamless 0-1 square with a baked albedo). Undo/redo in the top bar.
Answer in plain text, no markdown headings, at most about 110 words; use short numbered steps for how-tos. When the user asks you to make or change the landscape, use the tools, then say in one or two sentences what you changed and one thing they could sculpt by hand next. Never invent controls that are not listed.`;
async function ask(q){
  q=q.trim();if(!q)return;$('#hAsk').querySelector('.suggest')?.remove();addMsg('me',q);const bub=addMsg('bot thinking','Thinking…');
  if(!sampleFn){bub.classList.remove('thinking');bub.textContent=offline(q);return}
  const convo=chat.slice(-8).map(m=>(m.role==='user'?'User: ':'Helper: ')+m.content).join('\n');
  const input=`${MANUAL}\n\nCurrent terrain: ${JSON.stringify(stateSummary())}\n\n${convo?'Conversation so far:\n'+convo+'\n\n':''}User: ${q}`;
  try{
    const r=await sampleFn(input,{cache:false,tools:HELPER_TOOLS,onText:({text})=>{bub.classList.remove('thinking');bub.textContent=text;$('#hAsk').scrollTop=1e9}});
    bub.classList.remove('thinking');bub.textContent=r.text||bub.textContent;chat.push({role:'user',content:q},{role:'assistant',content:bub.textContent});
  }catch(e){
    bub.classList.remove('thinking');
    if(e&&e.code==='not_granted'){sampleFn=null;bub.textContent='The helper needs permission to ask Claude. Here is what the guides say:\n\n'+offline(q)}
    else if(e&&e.code==='rate_limited')bub.textContent='The helper is busy. Wait a minute and ask again.';
    else bub.textContent=(e&&e.text?e.text+'\n\n':'')+'The helper could not answer ('+((e&&e.message)||'unknown error')+').';
  }
}
function offline(q){
  const s=q.toLowerCase(),score=g=>(g.t+' '+g.p+' '+g.s.join(' ')).toLowerCase().split(/\W+/).filter(w=>w.length>3&&s.includes(w)).length;
  const best=GUIDES.map(g=>[score(g),g]).sort((a,b)=>b[0]-a[0])[0];
  if(best[0]>0)return`${best[1].t}:\n`+best[1].s.map((x,i)=>`${i+1}. ${x}`).join('\n')+'\n\nOpen Guides and tap "Set it up" to jump straight there.';
  if(/erod|rain|weather/.test(s))return TIPS.erode.replace(/<\/?b>/g,'');
  if(/export|blender|unity|unreal|godot|print|uv/.test(s))return TIPS.export.replace(/<\/?b>/g,'');
  return'Try the Guides tab for step-by-step recipes: volcano, river valley, canyon mesas, game-ready mesh, 3D print and heightmap.';
}
function openHelper(){$('#helper').hidden=false;if(!sampleChecked){sampleChecked=true;(async()=>{try{sampleFn=window.claude&&claude.use?await claude.use('sample'):null}catch(e){sampleFn=null}askIntro()})()}setTimeout(()=>$('#askInput').focus({preventScroll:true}),50)}
function closeHelper(){$('#helper').hidden=true}
$('#openHelper').onclick=openHelper;$('#closeHelper').onclick=closeHelper;
$('#hTabAsk').onclick=()=>{$('#hTabAsk').setAttribute('aria-pressed','true');$('#hTabGuides').setAttribute('aria-pressed','false');$('#hAsk').hidden=false;$('#hGuides').hidden=true;$('#askForm').hidden=false};
$('#hTabGuides').onclick=()=>{$('#hTabAsk').setAttribute('aria-pressed','false');$('#hTabGuides').setAttribute('aria-pressed','true');$('#hAsk').hidden=true;$('#hGuides').hidden=false;$('#askForm').hidden=true};
$('#askForm').onsubmit=e=>{e.preventDefault();const v=$('#askInput').value;$('#askInput').value='';ask(v)};
$('#askInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#askForm').requestSubmit()}};

/* ---------------- loop & boot ---------------- */
let dirty=true;
function loop(now){strokeTick(now);if(dirty){dirty=false;renderer.render(scene,camera)}requestAnimationFrame(loop)}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
(function boot(){
  const restored=load();
  if(!restored){S=DEF();N=S.res;genHeights();clearPaint()}
  if(PC.length!==N*N*3||PW.length!==N*N)clearPaint();
  S.mode='orbit';prevMaxH=S.shape.maxH;genMoist();buildGeometry();resize();applyTheme();updateAll();frame();renderSheet();renderGuides();syncUndo();
  askIntro();requestAnimationFrame(loop);
  toast(restored?'Welcome back. Your terrain was restored.':'Drag to orbit. Tap Sculpt to shape the land.');
})();
</script>
