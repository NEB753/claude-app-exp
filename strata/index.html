<title>Strata Terrain Sculptor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c6d6df">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D field; liquid-glass capsules float over it. Portrait: top bar, right tool rail, a bottom sheet with drag detents, and a creation dock. Wide screens: sheet becomes a left side panel. */
:root{
  --sky-a:#e6eef2; --sky-b:#bccdd8; --ink:#141c22; --ink-2:rgba(20,28,34,.66); --ink-3:rgba(20,28,34,.44);
  --tint:rgba(244,248,251,.26); --tint-strong:rgba(248,251,253,.78); --edge:rgba(255,255,255,.72); --hair:rgba(20,30,40,.10);
  --track:rgba(20,32,44,.09); --track-2:rgba(20,32,44,.16); --shadow:rgba(22,34,50,.24);
  --accent:#e8661c; --accent-hi:#ffa463; --accent-lo:#b9450b; --accent-ink:#fff8f2; --accent-soft:rgba(232,102,28,.15);
  --metal-hi:#fbfcfd; --metal-mid:#cdd1d7; --metal-lo:#a3a9b1; --metal-ink:#1a1e23;
  --node:rgba(255,255,255,.80); --node-head:rgba(255,255,255,.95); --wire:#8a949e; --good:#1f8f5f; --warn:#c07a12; --bad:#c2412d;
  --f-display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-xl:30px; --r-lg:22px; --r-md:16px; --r-sm:11px;
  --la:210deg; --lx:28%;
  --spring:cubic-bezier(.32,1.45,.48,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-a:#16212a; --sky-b:#090d11; --ink:#eef2f5; --ink-2:rgba(238,242,245,.68); --ink-3:rgba(238,242,245,.44);
  --tint:rgba(34,42,50,.34); --tint-strong:rgba(30,37,44,.84); --edge:rgba(255,255,255,.20); --hair:rgba(255,255,255,.10);
  --track:rgba(255,255,255,.08); --track-2:rgba(255,255,255,.15); --shadow:rgba(0,0,0,.5);
  --accent:#ff7a2e; --accent-hi:#ffb07a; --accent-lo:#c24f10; --accent-ink:#1d0d03; --accent-soft:rgba(255,122,46,.18);
  --metal-hi:#7b8189; --metal-mid:#4b5057; --metal-lo:#2f3338; --metal-ink:#f1f3f5;
  --node:rgba(32,38,45,.88); --node-head:rgba(44,51,59,.95); --wire:#76808b; --good:#4cc38a; --warn:#e7a43b; --bad:#ff7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-a:#16212a; --sky-b:#090d11; --ink:#eef2f5; --ink-2:rgba(238,242,245,.68); --ink-3:rgba(238,242,245,.44);
  --tint:rgba(34,42,50,.34); --tint-strong:rgba(30,37,44,.84); --edge:rgba(255,255,255,.20); --hair:rgba(255,255,255,.10);
  --track:rgba(255,255,255,.08); --track-2:rgba(255,255,255,.15); --shadow:rgba(0,0,0,.5);
  --accent:#ff7a2e; --accent-hi:#ffb07a; --accent-lo:#c24f10; --accent-ink:#1d0d03; --accent-soft:rgba(255,122,46,.18);
  --metal-hi:#7b8189; --metal-mid:#4b5057; --metal-lo:#2f3338; --metal-ink:#f1f3f5;
  --node:rgba(32,38,45,.88); --node-head:rgba(44,51,59,.95); --wire:#76808b; --good:#4cc38a; --warn:#e7a43b; --bad:#ff7a66; color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(130% 75% at 72% -8%,var(--sky-a) 0%,var(--sky-b) 78%) fixed,var(--sky-b);color:var(--ink);font-family:var(--f-body);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 60%),var(--tint);
  -webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.04);backdrop-filter:blur(20px) saturate(190%) brightness(1.04);
  border-radius:var(--r-xl);box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 18px rgba(255,255,255,.07),0 14px 34px -12px var(--shadow),0 2px 8px -3px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 90% at var(--lx) -20%,rgba(255,255,255,.34),rgba(255,255,255,0) 46%),linear-gradient(0deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:conic-gradient(from var(--la),rgba(255,255,255,.95),rgba(255,255,255,.12) 22%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.08) 74%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glass::before{opacity:.4}:root:not([data-theme="light"]) .glass::after{opacity:.55}}
:root[data-theme="dark"] .glass::before{opacity:.4}:root[data-theme="dark"] .glass::after{opacity:.55}
.press{transition:transform .35s var(--spring),background-color .2s}
.press:active{transform:scale(.94)}

/* metallic surfaces */
.metal{background:linear-gradient(180deg,var(--metal-hi) 0%,var(--metal-mid) 48%,var(--metal-lo) 52%,var(--metal-mid) 100%);color:var(--metal-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.18),0 2px 6px -2px var(--shadow)}
.metal.brushed{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.035) 1px 2px),linear-gradient(180deg,var(--metal-hi) 0%,var(--metal-mid) 48%,var(--metal-lo) 52%,var(--metal-mid) 100%)}
.anodized{background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent) 46%,var(--accent-lo) 54%,var(--accent) 100%);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.2),0 4px 14px -4px var(--accent)}

/* ---------- top bar & rail ---------- */
#top{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;max-width:720px;margin:0 auto;height:52px}
.brand{display:flex;align-items:center;gap:7px;height:42px;padding:0 10px 0 8px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand .chev{width:14px;height:14px;opacity:.55}
.crumb{min-width:0;flex:1;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ibtn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.ibtn:disabled{opacity:.28}
.ask{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 11px;border-radius:999px;font-weight:650;font-size:14px}
.ask svg{width:17px;height:17px}
#rail{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:6px;padding:5px;border-radius:999px}
#rail button{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
#rail button svg{width:20px;height:20px}
#rail button[aria-pressed="true"]{color:var(--accent-ink)}
#rail .sep{height:1px;background:var(--hair);margin:2px 8px}
#refPin{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 72px);padding:4px;border-radius:18px;width:112px}
#refPin img{display:block;width:100%;border-radius:14px}
#refPin.big{width:min(70vw,320px)}
.chip{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
#readout{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
#simChip{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:500}
#simChip i{width:8px;height:8px;border-radius:50%;background:#3aa0d8;box-shadow:0 0 0 3px rgba(58,160,216,.25);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(58,160,216,.05)}}

/* ---------- bottom sheet + dock ---------- */
#bottom{position:fixed;z-index:6;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto}
#sheet{height:var(--sheet-h,44vh);display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-xl);transition:height .42s var(--spring)}
#sheet.dragging{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab span{width:38px;height:5px;border-radius:5px;background:var(--track-2)}
#sheetHead{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 8px 16px;min-height:44px}
#sheetHead h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
#sheetHead .grow{flex:1;min-width:0}
.sheet-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px 16px 18px;overscroll-behavior:contain}
#dock{display:flex;gap:2px;padding:5px;border-radius:999px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#dock::-webkit-scrollbar{display:none}
#dock button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:10px;letter-spacing:-.01em;font-weight:650;color:var(--ink-2);min-width:0;white-space:nowrap}
#dock button svg{width:21px;height:21px}
#dock button[aria-selected="true"]{color:var(--accent);background:var(--tint-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 10px -3px var(--shadow)}

/* ---------- controls ---------- */
.tip{margin:0 0 12px;font-size:13px;line-height:1.45;color:var(--ink-2);text-wrap:pretty}
.tip b{color:var(--ink);font-weight:650}
.label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px}
.row{display:grid;grid-template-columns:minmax(78px,96px) 1fr 54px 26px;align-items:center;gap:6px;min-height:40px}
.row>label{font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;padding:6px 2px;border-radius:8px}
.row .val:active{background:var(--track)}
.row input.num{width:100%;font-family:var(--f-mono);font-size:13px;text-align:right;border:1px solid var(--accent);border-radius:8px;background:var(--tint-strong);padding:5px 4px}
.row .dice{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.row .dice svg{width:16px;height:16px}
.row .dice:active{color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;--p:50%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent-lo),var(--accent) var(--p),var(--track-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:20px;margin-top:-7px;border-radius:12px;
  background:linear-gradient(180deg,#fff,#dde1e6 50%,#c8cdd3 51%,#eef0f2);border:.5px solid rgba(0,0,0,.12);box-shadow:0 3px 10px var(--shadow),inset 0 1px 0 #fff}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:18px;border-radius:10px;background:#eef0f2;border:.5px solid rgba(0,0,0,.15);box-shadow:0 3px 10px var(--shadow)}

.acc{border-top:1px solid var(--hair)}
.acc:first-of-type{border-top:0}
.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:650;font-size:14.5px;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .sum{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3);font-family:var(--f-mono)}
.acc>summary .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .3s var(--spring)}
.acc[open]>summary .chev{transform:rotate(90deg)}
.acc .acc-body{padding:0 0 10px}

.dd{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 13px;border-radius:999px;font-size:13.5px;font-weight:650;max-width:100%;min-width:0}
.dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd svg{width:14px;height:14px;opacity:.6}
.dd.wide{display:flex;width:100%;justify-content:space-between;height:42px;border-radius:14px}
#menuLayer{position:fixed;inset:0;z-index:30;pointer-events:none}
#menuLayer.on{pointer-events:auto}
.pop{position:fixed;min-width:200px;max-width:min(320px,calc(100vw - 24px));max-height:min(60vh,460px);overflow-y:auto;padding:6px;border-radius:20px;background:var(--tint-strong);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:0 22px 50px -12px var(--shadow),inset 0 0 0 .5px var(--edge);
  transform-origin:top center;animation:popIn .32s var(--spring)}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(-6px)}}
.pop h4{margin:8px 10px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pop button.it{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;text-align:left;font-size:14.5px}
.pop button.it:active,.pop button.it:hover{background:var(--track)}
.pop button.it small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.pop button.it .ck{margin-left:auto;color:var(--accent);width:16px;height:16px}
.pop .sw{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pop .row{padding:0 6px}
.pop .seg{margin:4px 6px 8px}

.seg{display:flex;padding:3px;border-radius:14px;background:var(--track);gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:13px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--tint-strong);color:var(--ink);box-shadow:0 2px 8px -2px var(--shadow),inset 0 1px 0 rgba(255,255,255,.5)}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border-radius:var(--r-md);background:var(--track);font-size:11.5px;font-weight:650;color:var(--ink-2);min-width:0}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;padding:8px 12px;border-radius:999px;background:var(--track);font-size:13px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--sky-a)}
.swatch{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;min-width:110px;min-height:44px;padding:10px 14px;border-radius:var(--r-md);font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.plain{background:var(--track)}
.btn:disabled{opacity:.45}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-size:14px}
.toggle small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--track-2);transition:background .25s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#fff,#e8eaee);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch input:checked + span{background:linear-gradient(180deg,var(--accent-hi),var(--accent))}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-family:var(--f-mono);font-size:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--track);font-variant-numeric:tabular-nums;margin-top:10px}
.facts span:nth-child(odd){color:var(--ink-3)}
.facts span:nth-child(even){text-align:right}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}
.prompt{display:flex;gap:8px;align-items:flex-end;padding:6px;border-radius:20px;background:var(--track);margin-bottom:10px}
.prompt textarea{flex:1;min-width:0;resize:none;border:0;outline:none;background:transparent;padding:8px 8px;font-size:15px;line-height:1.35;height:38px;max-height:110px;-webkit-user-select:text;user-select:text}
.prompt button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.prompt button svg{width:18px;height:18px}
.ai-note{font-size:12.5px;color:var(--ink-2);margin:-4px 2px 10px;line-height:1.4;white-space:pre-wrap}
.seedrow{display:flex;gap:8px;align-items:center}
.seed{flex:1;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:42px;border-radius:14px;background:var(--track);font-family:var(--f-mono);font-size:14px;min-width:0}
.seed input{width:100%;min-width:0;background:transparent;border:0;outline:none;font-family:var(--f-mono)}
.seed span{color:var(--ink-3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-family:var(--f-body);font-weight:700}
.vars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.vars button{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--track);max-width:100%}
.vars canvas{width:100%;height:100%;display:block}
.vars small{position:absolute;left:5px;bottom:4px;font-family:var(--f-mono);font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.padwrap{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:stretch}
.pad{position:relative;aspect-ratio:1.35;border-radius:18px;touch-action:none;overflow:hidden;
  background:linear-gradient(90deg,rgba(59,130,170,.18),rgba(232,102,28,.18)),linear-gradient(0deg,rgba(255,255,255,.0),rgba(255,255,255,.12)),var(--track);box-shadow:inset 0 0 0 1px var(--hair)}
.pad::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:25% 25%}
.pad .knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:linear-gradient(180deg,#fff,#d8dce1);box-shadow:0 4px 14px var(--shadow),0 0 0 4px var(--accent-soft)}
.pad .ax{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.preview{border-radius:18px;overflow:hidden;background:var(--track);position:relative}
.preview canvas{width:100%;height:100%;display:block;object-fit:cover}
.photo-drop{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--track)}
.photo-drop .thumb{width:84px;height:84px;border-radius:14px;background:var(--track-2) center/cover;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.photo-drop .thumb svg{width:28px;height:28px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:var(--track);font-size:11.5px;font-weight:650;color:var(--ink-2)}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}

/* ---------- node graph ---------- */
.graph{position:relative;height:clamp(260px,46vh,560px);border-radius:20px;overflow:hidden;touch-action:none;background:
  radial-gradient(circle at 1px 1px,var(--track-2) 1px,transparent 1.5px) 0 0/22px 22px,var(--track)}
.graph-inner{position:absolute;left:0;top:0;transform-origin:0 0}
.graph svg.wires{position:absolute;left:0;top:0;width:4000px;height:4000px;overflow:visible;pointer-events:none}
.graph svg.wires path{fill:none;stroke:var(--wire);stroke-width:2.4}
.graph svg.wires path.live{stroke:var(--accent);stroke-dasharray:6 5}
.node{position:absolute;width:132px;border-radius:16px;background:var(--node);box-shadow:0 8px 22px -10px var(--shadow),inset 0 0 0 .5px var(--edge),inset 0 1px 0 rgba(255,255,255,.4);font-size:12px}
.node.sel{box-shadow:0 0 0 2px var(--accent),0 10px 26px -8px var(--shadow)}
.node .nh{display:flex;align-items:center;gap:6px;padding:7px 9px 6px;border-radius:16px 16px 0 0;background:var(--node-head);font-weight:700;cursor:grab;touch-action:none}
.node .nh i{width:8px;height:8px;border-radius:3px;flex:none}
.node .nh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node canvas{display:block;width:116px;height:72px;margin:6px 8px 8px;border-radius:10px;background:var(--track)}
.port{position:absolute;width:24px;height:24px;display:grid;place-items:center;touch-action:none}
.port::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--node-head);box-shadow:inset 0 0 0 2.5px var(--wire)}
.port.in{left:-12px}.port.out{right:-12px}
.port.on::after{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent)}
.port.target::after{box-shadow:0 0 0 4px var(--accent-soft),inset 0 0 0 2.5px var(--accent)}
.port small{position:absolute;left:18px;font-size:9.5px;color:var(--ink-3);white-space:nowrap;pointer-events:none}
.gbar{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.gbar .dd{height:34px}
.ginfo{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--ink-3);pointer-events:none}

/* ---------- helper ---------- */
#helper{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  right:max(10px,env(safe-area-inset-right,0px));width:min(420px,calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:flex;flex-direction:column;overflow:hidden;background:var(--tint-strong)}
.h-head{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 18px}
.h-head h2{margin:0;flex:1;font-family:var(--f-display);font-size:22px}
.h-tabs{margin:0 14px 8px}
.h-body{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px 16px 12px;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{margin-left:auto;border-bottom-right-radius:6px}
.msg.bot{background:var(--track);border-bottom-left-radius:6px}
.msg.thinking{color:var(--ink-3)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.suggest button{padding:8px 12px;border-radius:999px;background:var(--track);font-size:13px;text-align:left}
.h-input{padding:10px;border-top:1px solid var(--hair)}
.h-input .prompt{margin:0}
.guide{border-top:1px solid var(--hair);padding:12px 0}
.guide:first-child{border-top:0}
.guide h3{margin:0 0 4px;font-size:16px;font-family:var(--f-display);font-weight:700}
.guide p{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.guide ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}

#toast{position:fixed;z-index:40;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#busy{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.12)}
#busy>div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px;min-width:220px;font-weight:650}
#busy .bar{width:100%;height:5px;border-radius:5px;background:var(--track-2);overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-lo),var(--accent-hi));transition:width .2s}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--track-2);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}

@media (max-width:420px){.brand b{display:none}.ask b{display:none}.ask{padding:0 12px}.row{grid-template-columns:76px 1fr 50px 24px}}
@media (min-width:900px){
  #bottom{left:max(14px,env(safe-area-inset-left,0px));right:auto;width:420px;margin:0;top:calc(env(safe-area-inset-top,0px) + 70px);flex-direction:column-reverse;justify-content:flex-end}
  #sheet{height:auto!important;flex:1 1 auto;max-height:100%}
  .grab{display:none}
  #sheetHead{padding-top:12px}
  #top{max-width:none}
  #refPin{left:450px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
